[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quotaguard"
version = "0.2.0"
authors = [
  { name = "QuotaGuard Core Team" },
]
description = "Local AI Gateway & Caching Proxy: Verified multi-tier semantic caching, deduplication, and intelligent routing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy>=1.20.0"
]

[project.scripts]
quotaguard = "quotaguard.cli.main:main"

[tool.setuptools.packages.find]
include = ["quotaguard*"]
